name: typed-nova-signature-fix

on:
  push:
    branches: [fix/nova-typed-signatures]
    paths:
      - ".github/workflows/typed-nova-signature-fix.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: fix/nova-typed-signatures

      - name: Verify frozen source branch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=f8a4d642eaa721741ab3cea7eb02d2f261dbad01
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = ".github/workflows/typed-nova-signature-fix.yml"

      - name: Add typed Nova signature support
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/mini_language_server/nova.py")
          text = path.read_text()

          old = '''_IDENTIFIER = r"[A-Za-z_][A-Za-z0-9_]*"
          _FUNCTION_DECLARATION = re.compile(rf"\\bfn\\s+({_IDENTIFIER})\\s*\\(([^)]*)\\)\\s*\\{{")
          _CALL = re.compile(rf"\\b({_IDENTIFIER})\\s*(?=\\()")
          _IDENTIFIER_MATCH = re.compile(rf"\\b({_IDENTIFIER})\\b")
          _PARAMETER_PART = re.compile(r"[^,]+")
          _LOCAL_DECLARATION = re.compile(rf"\\blet\\s+({_IDENTIFIER})\\b")
          '''
          new = '''_IDENTIFIER = r"[A-Za-z_][A-Za-z0-9_]*"
          _SIMPLE_TYPE_REF = rf"(?:{_IDENTIFIER}|!)"
          _FUNCTION_DECLARATION = re.compile(
              rf"\\bfn\\s+({_IDENTIFIER})\\s*\\(([^)]*)\\)\\s*(?:->\\s*{_SIMPLE_TYPE_REF}\\s*)?\\{{"
          )
          _CALL = re.compile(rf"\\b({_IDENTIFIER})\\s*(?=\\()")
          _IDENTIFIER_MATCH = re.compile(rf"\\b({_IDENTIFIER})\\b")
          _PARAMETER_PART = re.compile(r"[^,]+")
          _PARAMETER = re.compile(
              rf"^\\s*({_IDENTIFIER})(?:\\s*:\\s*{_SIMPLE_TYPE_REF})?\\s*$"
          )
          _LOCAL_DECLARATION = re.compile(rf"\\blet\\s+({_IDENTIFIER})\\b")
          '''
          if old not in text:
              raise SystemExit("top-level Nova regex block no longer matches frozen source")
          text = text.replace(old, new, 1)

          old = '''    The adapter owns named ``fn`` declarations, identifier calls, simple identifier
              parameters, and function-scoped ``let`` variables. Parameter and local references
          '''
          new = '''    The adapter owns named ``fn`` declarations, identifier calls, bare legacy or
              Nova-style typed parameters with simple identifier/never surface types, optional
              explicit simple return types, and function-scoped ``let`` variables. Parameter and
              local references
          '''
          if old not in text:
              raise SystemExit("Nova adapter docstring block no longer matches frozen source")
          text = text.replace(old, new, 1)

          start_marker = "        for part in _PARAMETER_PART.finditer(parameter_text):\n"
          end_marker = "        return tuple(parameters)\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = (
              "        for part in _PARAMETER_PART.finditer(parameter_text):\n"
              "            raw = part.group(0)\n"
              "            match = _PARAMETER.fullmatch(raw)\n"
              "            if match is None:\n"
              "                continue\n"
              "            name = match.group(1)\n"
              "            start = base_offset + part.start() + match.start(1)\n"
              "            parameters.append(\n"
              "                NovaScopedName(owner, name, Span(start, start + len(name)))\n"
              "            )\n"
          )
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

          cat > tests/test_nova_typed_signatures.py <<'PY'
          from __future__ import annotations

          from typing import Any

          from mini_language_server.nova import NovaFunctionAdapter, NovaLanguageServer


          def request(
              method: str, request_id: int, params: dict[str, Any] | None = None
          ) -> dict[str, Any]:
              message: dict[str, Any] = {
                  "jsonrpc": "2.0",
                  "id": request_id,
                  "method": method,
              }
              if params is not None:
                  message["params"] = params
              return message


          def notification(method: str, params: dict[str, Any]) -> dict[str, Any]:
              return {"jsonrpc": "2.0", "method": method, "params": params}


          def initialize(server: NovaLanguageServer) -> None:
              response = server.handle(request("initialize", 1, {"capabilities": {}}))
              assert response is not None and "result" in response


          def open_nova(server: NovaLanguageServer, uri: str, text: str) -> None:
              server.handle(
                  notification(
                      "textDocument/didOpen",
                      {
                          "textDocument": {
                              "uri": uri,
                              "languageId": "nova",
                              "version": 1,
                              "text": text,
                          }
                      },
                  )
              )


          def test_adapter_accepts_real_typed_nova_function_signatures() -> None:
              text = (
                  "fn helper(value: Int) -> Int { value }\n"
                  "fn main() -> Int { let local = 1 helper(local) }\n"
              )
              parsed = NovaFunctionAdapter.parse(text)

              assert [name for name, _ in parsed.declarations] == ["helper", "main"]
              assert [parameter.name for parameter in parsed.parameters] == ["value"]
              assert [reference.name for reference in parsed.parameter_references] == ["value"]
              assert [local.name for local in parsed.locals] == ["local"]
              assert [reference.name for reference in parsed.local_references] == ["local"]
              assert [name for name, _ in parsed.calls] == ["helper"]
              assert not parsed.unresolved_names


          def test_typed_nova_signature_publishes_parameter_and_unresolved_name_semantics() -> None:
              server = NovaLanguageServer()
              initialize(server)
              uri = "file:///workspace/typed-signature.nova"
              open_nova(server, uri, "fn main(input: Int) -> Int { input missing }\n")

              semantics = server.semantics.get(uri)
              diagnostics = server.diagnostics.get(uri)
              assert semantics is not None
              assert diagnostics is not None
              assert [(symbol.name, symbol.kind) for symbol in semantics.symbols.symbols] == [
                  ("main", "function"),
                  ("input", "parameter"),
              ]
              assert len(semantics.references) == 1
              assert semantics.references[0].target.name == "input"
              assert semantics.references[0].target.kind == "parameter"
              assert [item.code for item in diagnostics.diagnostics] == ["nova.unresolved-name"]
              assert diagnostics.diagnostics[0].message == "unresolved name 'missing'"


          def test_legacy_bounded_untyped_signature_remains_supported() -> None:
              parsed = NovaFunctionAdapter.parse("fn main(input) { input }\n")
              assert [parameter.name for parameter in parsed.parameters] == ["input"]
              assert [reference.name for reference in parsed.parameter_references] == ["input"]
          PY

      - name: Run source CI gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m ruff check .
          python -m pytest

      - name: Publish verified fix branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "f8a4d642eaa721741ab3cea7eb02d2f261dbad01"
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/mini_language_server/nova.py tests/test_nova_typed_signatures.py
          git rm .github/workflows/typed-nova-signature-fix.yml
          git commit -m "fix: accept typed Nova function signatures"
          git push origin HEAD:fix/nova-typed-signatures
